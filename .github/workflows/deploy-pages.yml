name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            app
            public
            experiments/blender-material-owner-quality-coupling-derivation-v0-1/results.json
            experiments/blender-material-owner-quality-coupling-derivation-v0-1/audit.json
            experiments/blender-material-owner-quality-coupling-derivation-v0-1/execution.json
            experiments/blender-material-owner-rigid-directional-calibration-v0-1/results.json
            experiments/blender-material-owner-rigid-directional-calibration-v0-1/audit.json
            experiments/blender-material-owner-rigid-directional-calibration-v0-1/execution.json
            experiments/blender-material-owner-rigid-directional-render-holdout-v0-1/failure.json
            experiments/blender-material-owner-rigid-directional-position-oracle-development-v0-1/results.json
            experiments/blender-material-owner-rigid-directional-position-oracle-development-v0-1/audit.posthoc.json
            experiments/blender-material-owner-projective-depth-holdout-preflight-v0-1/preflight.json
            experiments/blender-material-owner-projective-depth-holdout-formal-invocation-failure-v0-1/failure.json
            experiments/blender-material-owner-projective-depth-holdout-formal-invocation-failure-v0-1/receipt.json
            experiments/formal-runner-admission-path-totality-v0-1/audit.json
            experiments/formal-runner-admission-path-totality-v0-1/results.json
            experiments/formal-runner-admission-path-totality-v0-1/receipt.json
            specs/formal-runner-admission-path-totality.v0.1.json
            experiments/admission-gated-native-compiler-preflight-v0-1/preflight.json
            experiments/admission-gated-native-compiler-v0-1/audit.json
            experiments/admission-gated-native-compiler-v0-1/results.json
            experiments/admission-gated-native-compiler-v0-1/receipt.json
            specs/admission-gated-native-compiler-integration.v0.1.json
            experiments/budgeted-native-child-pid-receipt-preflight-v0-1/preflight.json
            experiments/budgeted-native-child-pid-receipt-v0-1/audit.json
            experiments/budgeted-native-child-pid-receipt-v0-1/results.json
            experiments/budgeted-native-child-pid-receipt-v0-1/receipt.json
            specs/budgeted-native-child-pid-receipt-correction.v0.1.json
            experiments/production-compiler-entry-promotion-preflight-v0-1/preflight.json
            experiments/production-compiler-entry-promotion-v0-1/audit.json
            experiments/production-compiler-entry-promotion-v0-1/results.json
            experiments/production-compiler-entry-promotion-v0-1/receipt.json
            specs/production-compiler-entry-promotion.v0.1.json
            specs/production-compiler-entry.v0.1.json
            experiments/b57-formal-rehearsal-c2-v0-1/audit.json
            experiments/b57-formal-rehearsal-c2-v0-1/results.json
            experiments/production-disk-jit-readmission-preflight-v0-1/preflight.json
            experiments/production-disk-jit-readmission-v0-1/audit.json
            experiments/production-disk-jit-readmission-v0-1/results.json
            experiments/production-disk-jit-readmission-v0-1/receipt.json
            experiments/production-disk-jit-readmission-v0-1/low-disk/native-compile-disk-admission.json
            specs/production-disk-jit-readmission.v0.1.json
            specs/production-compiler-entry.v0.2.json
            experiments/cinematic-render-repro-cost-v0-5/audit.json
            experiments/cinematic-render-repro-cost-v0-5/receipt.json
            experiments/b62-phase0-v0-4/audit.json
            experiments/b62-phase0-v0-4/receipt.json
            experiments/b62-phase0-v0-4/reports/blender-audit.json
            experiments/b62-phase0-v0-4/calibration/WIDE_APPROACH-0048.pixel.json
            experiments/b62-phase0-v0-4/calibration/MEDIUM_CONTACT-0144.pixel.json
            experiments/b62-phase0-v0-4/calibration/CLOSE_REFLECTION-0240.pixel.json
            experiments/b62-camera-quality-holdout-render-v0-5/audit.json
            experiments/b62-camera-quality-holdout-render-v0-5/receipt.json
            experiments/b62-camera-quality-holdout-render-v0-5/render.json
            experiments/b62-camera-quality-holdout-render-v0-5/independent.json
            package.json
            package-lock.json
            next.config.ts
            next-env.d.ts
            tsconfig.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
